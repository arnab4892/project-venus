  - id: prod-overview-industrial
    # Presentation shape (presentation-shapes): a broad division ask must ORIENT in 3–5 clusters,
    # not enumerate with spec dumps. The must_not figure — 25000, the Process family's published
    # max Nm³/hr — appears only in a per-family spec recitation and never in a faithful grouped
    # overview, so it fails a spec-dump answer while the orienting shape passes. Family grounding is
    # unchanged: list_products force-cites fam.process_recip (as in prod-list-industrial). Distinct
    # from prod-list-industrial (which keeps its own contains-only assertion) — this adds the shape
    # guard without weakening it.
    question: "What do you offer in industrial compressors?"
    expected_answer_contains: ["compressor"]
    must_not_contain: ["25000"]
    expected_source_ids: ["fam.process_recip"]
    expected_outcome: answer
    fact:
      tool: list_products
      args: {division: industrial}
      expect_ids: ["fam.process_recip"]

  - id: prod-compare-process-natgas
    # Presentation shape (presentation-shapes): an explicit CROSS-FAMILY comparison must render an
    # attribute table grounded per item via the multi-fetch (LLD-AG-02: structured lookup per item +
    # a targeted retrieval per item, each compared family force-cited from the division listing).
    # Cross-family by design — a same-family pair would pass without the multi-fetch and guard
    # nothing. The pipe proves a Markdown table rendered (persona prose never emits '|'); the two
    # nouns prove both columns. Proven groundable by the live trace (turn f0d5b413) and by the
    # targeted per-item retrieval (process-spec + natural-gas-spec chunks both surface).
