# Ingestion seed for the Jyotech crawler (LLD-ING-01).
#
# Generated by the milestone-2 discovery crawl: starting from `start_url`,
# same-host, depth 2, following .html/.php/.pdf links (1s polite delay). On
# subsequent runs the crawler is driven by THIS file (it does not re-discover).
#
# NOTE (docs-vs-reality): the live depth-2 crawl finds 27 unique HTML/PHP pages.
# LLD-ING-01 says "11 HTML URLs" — that count is exactly the homepage PRIMARY NAV
# (11 links); the other 16 are second-level pages reached at depth 2. The "11"
# was a design-time count, not a limit; the full set is kept here and the LLD
# note will be folded in during the doc pass (see docs/changes/milestone-2-notes.md).
# The two suspicious filenames are real nav pages: gallery-test2.html = "Gallery",
# catalogue-testing.html = "Catalogue" (poor dev naming, not test pages).
#
# Pruning is a visible config decision: put a URL under `exclude:` (empty now) to
# drop it from a run. The conversion report flags exclusion CANDIDATES on content
# grounds — near-duplicate text (e.g. catalogue1.html vs catalogue-testing.html
# both carry the same two PDF links), near-empty pages, and nav-orphaned pages —
# for a human to decide; nothing is auto-excluded.
#
# URLs are stored canonical + percent-encoded. The two catalogue PDFs really do
# contain a literal space (and an "&" in the F&S filename) on the live site —
# stored here as %20 / %26.

client: jyotech
start_url: https://www.jyotech.com/index.php

crawl:
  same_host_only: true
  max_depth: 2
  delay_seconds: 1
  follow_extensions: [".html", ".php", ".pdf"]
  user_agent: "JyotechAgentBot/0.1 (+ingestion stage 1)"

# HTML/PHP page URLs discovered by the crawl.
pages:
  - https://www.jyotech.com/index.php
  - https://www.jyotech.com/about.html
  - https://www.jyotech.com/achievement.html
  - https://www.jyotech.com/process-gas-compressors.html
  - https://www.jyotech.com/Diaphragm-compressors.html
  - https://www.jyotech.com/cng-bio-gas-compressors.html
  - https://www.jyotech.com/cng-boosters.html
  - https://www.jyotech.com/hydrogen-compressors-and-fueling%20system.html
  - https://www.jyotech.com/air-seperation-plants.html
  - https://www.jyotech.com/medium-and-high-pressure-air.html
  - https://www.jyotech.com/compact-and-super-silent-machine.html
  - https://www.jyotech.com/portable%20Compressor.html
  - https://www.jyotech.com/low-pressure-breathing-air-system.html
  - https://www.jyotech.com/fire-protection-disaster-management-equipment.html
  - https://www.jyotech.com/fire-protection-clothing.html
  - https://www.jyotech.com/ppv-blowers-and-smoke-extractors.html
  - https://www.jyotech.com/hydraulic-cutting-tools.html
  - https://www.jyotech.com/air-lifting-bags-and-accessories.html
  - https://www.jyotech.com/leak-control-kit.html
  - https://www.jyotech.com/diving-accessories.html
  - https://www.jyotech.com/surface-demand-diving-equipment.html
  - https://www.jyotech.com/under-water-breathing-apparatus-set.html
  - https://www.jyotech.com/catalogue1.html
  - https://www.jyotech.com/catalogue-testing.html
  - https://www.jyotech.com/gallery-test2.html
  - https://www.jyotech.com/career.php
  - https://www.jyotech.com/contact.php

# Catalogue PDFs (percent-encoded; literal space + "&" on the live site).
pdfs:
  - https://www.jyotech.com/pdf/Jyotech%20Catalog%20-%20PROCESS.pdf
  - https://www.jyotech.com/pdf/Jyotech%20Catalog%20-%20F%26S.pdf

# Sources to skip on a run (visible, human-owned pruning). The conversion report
# flags candidates (near-duplicate / near-empty / nav-orphaned) but never
# auto-excludes. List full canonical URLs here to drop them.
exclude:
  # template placeholder alt-text only, no real content (milestone-2 review)
  - https://www.jyotech.com/achievement.html
  # near-empty: headings + "Responsive Image" placeholders only, no real content
  - https://www.jyotech.com/fire-protection-clothing.html
  # byte-identical duplicate of catalogue-testing.html (the live nav "Catalogue"
  # page); keep catalogue-testing.html, drop this redundant copy
  - https://www.jyotech.com/catalogue1.html

# CSS selectors stripped from every fetched HTML page before Markdown
# conversion (LLD-ING-02). Derived by inspecting the live Bootstrap markup.
strip_selectors:
  - nav                            # top navigation bar
  - header                         # header block (carries the nav menu tree)
  - script
  - style
  - noscript
  - iframe                         # Google-maps embed + a clients.html embed
  - .container-fluid.bg-primary    # top contact/social bar (phone, email, FB/LinkedIn)
  - .container-fluid.bg-dark       # dark footer band (about, quick links, logo)
  - .container-fluid.text-white    # bottom copyright bar
  - .floating-buttons              # floating social / WhatsApp buttons
  - .back-to-top                   # scroll-to-top control
  - .modal                         # hidden modal dialogs
  - .breadcrumb                    # breadcrumb trail (Home > …) — navigation
  - .blog-item                     # trailing teaser cards linking other products

# Generic HTML cleaner rules are in code; these per-client value lists drive
# them (LLD-ING-02). Matched case-insensitively.
drop_alt_text:                     # image alt placeholders → bare text nodes
  - Image
  - Responsive Image
drop_link_text:                    # teaser link stubs
  - Read More
