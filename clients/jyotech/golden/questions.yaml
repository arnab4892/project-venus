  - id: prod-diving-accessories-family
    # Target the family by name so the parse resolves it via get_product (a generic "what's in
    # your range" is read as a category and gives a thin listing).
    question: "Tell me about the products in your Diving Accessories range."
    expected_answer_contains: ["diving"]
    expected_source_ids: ["fam.diving_accessories"]
