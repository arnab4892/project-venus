  - id: docs-truncation-canary
    question: "Are your smoke exhausters and PPV blowers AMCA certified?"
    expected_answer_contains: ["AMCA"]
    # The truncation canary is guarded at the RETRIEVAL layer (locator-pinned) below; e2e only
    # asserts the answer surfaces "AMCA" (the tail-of-chunk content that truncation would lose).
    expected_source_ids: []
    expected_outcome: answer
    retrieval:
      # Truncation canary (LLD-RET-02). "AMCA certified" sits at the END of the longest chunk
      # (the F&S catalogue intro, 820 tokens) and occurs NOWHERE else in the corpus — if the
      # embedder had silently truncated that chunk, this tail text would not be embedded and
      # the passage would not be retrievable for this query. Pinned by its stable locator
      # (page/§ heading), NOT a chunk id: chunk ids renumber whenever chunking config changes,
      # and the canary must fail only on real truncation.
      query: "AMCA certified smoke exhausters and PPV blowers"
      expect_locator: "FIRE RESCUE & DIVING EQUIPMENT Catalogue"

