[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentkit"
version = "0.1.0"
description = "Nyalazone reusable RAG-agent framework (Jyotech Agent, iteration 1)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    # web / runtime
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "langgraph>=0.2,<0.3",
    # data layer
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<0.4",
    "psycopg[binary]>=3.2,<4.0",
    # models / config
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    # ingestion / release
    "docling>=2.0,<3.0",
    "openpyxl>=3.1,<4.0",
    # cli / misc
    "typer>=0.15,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
]

[project.scripts]
agentkit = "agentkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
