    # path — an incomplete duty would only ask a slot (single-turn e2e-trap audit, 5b).
    question: "Can you supply an oxygen compressor for 5000 Nm3/hr at 350 bar discharge?"
    expected_answer_contains: ["engineers"]
    expected_source_ids: []
    expected_outcome: handoff
