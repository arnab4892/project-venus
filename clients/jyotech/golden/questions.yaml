# Golden question suite (LLD-EVAL-01). 46 questions (the initial 40 + a 6-question Gate-2
# extension, recorded in docs/changes/milestone-4-notes.md): 18 capability, 12 product,
# 8 company/docs, 6 after-sales, 2 out-of-scope. Each carries the LLD-EVAL-01 fields
# (question, expected_answer_contains, expected_source_ids, expected_outcome) plus optional
# `fact` / `retrieval` execution blocks the runner uses to score the fact and retrieval
# layers against the LIVE active release. The e2e (agent-answer) layer is reported "pending"
# until the agents land (milestone 5).
#
# expected_outcome ∈ {answer, asked_slot, handoff, refuse, out_of_scope}.
# fact:      {tool, args, expect_ids}   — ids that MUST appear in the tool result
# retrieval: {query?, division?, family_ids?, expect_doc|expect_locator|expect_chunk_ids}

questions:

  # ---- capability (15) ---------------------------------------------------
  - id: cap-hydrogen-process
    question: "We need to compress hydrogen, about 3000 Nm3/hr from 20 to 350 bar. Oil-free is mandatory."
    expected_answer_contains: ["process gas", "reciprocating"]
    expected_source_ids: ["cap.doc_jyotech_catalog_process_s005.0", "fam.process_recip"]
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: hydrogen, capacity: 3000, capacity_unit: "Nm3/hr", discharge_p: 350, lubricated: false}
      expect_ids: ["fam.process_recip"]
    retrieval:
      query: "hydrogen process gas compressor API-618"
      expect_doc: doc.jyotech_catalog_process

