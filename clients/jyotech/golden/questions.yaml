  - id: cap-natural-gas
    question: "Natural gas compressor for roughly 20000 SCMD at 100 bar?"
    # The duty matches both the gas-specific and the broad Process family; the runtime may lead
    # with either, but force-cited, so both families are grounded. "natural" is present either way
    # and is robust to "natural gas" vs "natural-gas" phrasing.
    expected_answer_contains: ["natural"]
    expected_source_ids: ["fam.natural_gas_recip"]
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: "natural gas", capacity: 20000, capacity_unit: "SCMD", discharge_p: 100}
      expect_ids: ["fam.natural_gas_recip"]

  - id: cap-wellhead-natgas
    # Regression (turn 271ff0e2): a complete SCMD wellhead duty. The RIGHT family is the SCMD
    # natural-gas machine (same unit, gas-engine driven), not the broad process family whose
    # 25,000 Nm³/hr figure belongs to a different line. Guards: the answer cites the SCMD family and
    # never recites the wrong family's 25,000 (same-unit ranking + the all-message numeric guard).
    question: "Natural gas, 50000 SCMD, wellhead application, gas engine driven, 120 bar"
    expected_answer_contains: ["natural"]
    # Tightening (slot-guard-conversion): the wrong Process-family match derived an unsourced 10×
    # SCMD→Nm³/hr prose conversion (20,833 for the 50,000 SCMD duty); guard against that figure too.
    must_not_contain: ["25000", "20833", "20,833"]
    expected_source_ids: ["fam.natural_gas_recip"]
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: "natural gas", capacity: 50000, capacity_unit: "SCMD", discharge_p: 120}
      expect_ids: ["fam.natural_gas_recip"]

