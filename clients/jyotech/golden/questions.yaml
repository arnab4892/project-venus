# Golden question suite (LLD-EVAL-01). 62 questions (the initial 40 + a 6-question Gate-2
# extension + prod-mch16-specs + adversarial-round faq-eiga / faq-founder / cap-false-memory +
# cap-wellhead-natgas + the faq-api618 machine-standards routing regression + the polish-pass
# docs-both-catalogues multi-card golden + the PRD-F-012 Hindi pair e2e-hindi-hydrogen /
# e2e-hindi-price + the presentation-shapes trio prod-overview-industrial /
# prod-compare-process-natgas / prod-overview-industrial-hi + cap-false-memory-product, the
# product-route envelope-lookup twin + the presentation-intelligence two-part shape golden
# faq-founded-and-founder, with co-founded strengthened to a single-fact no-table shape guard;
# + the station-task pair cap-station-hydrogen-fuelling (per-area application fetch, luck-proof via
# the capability-row citation) and prod-compare-smart-ergo-mch16 (variant name resolution, Exhibit
# C, each variant's own family id)): 21 capability,
# 19 product, 14 company/docs, 6 after-sales, 2 out-of-scope. Each carries the LLD-EVAL-01 fields
# (question, expected_answer_contains, expected_source_ids, expected_outcome) plus optional
# `fact` / `retrieval` execution blocks the runner uses to score the fact and retrieval
# layers against the LIVE active release. The e2e (agent-answer) layer is reported "pending"
# until the agents land (milestone 5).
#
# expected_outcome ∈ {answer, asked_slot, handoff, refuse, out_of_scope, fallback}.
#   fallback = the grounding gate stripped the draft and shipped the fallback sentence
#   (distinct from answer). No golden expects it today.
# fact:      {tool, args, expect_ids}   — ids that MUST appear in the tool result
# retrieval: {query?, division?, family_ids?, expect_doc|expect_locator|expect_chunk_ids}

questions:

  # ---- capability (20) ---------------------------------------------------
  - id: cap-hydrogen-process
    question: "We need to compress hydrogen, about 3000 Nm3/hr from 20 to 350 bar. Oil-free is mandatory."
    # The live family's customer-facing name is "Process Compressors (Recip.)" — assert robust
    # substrings a correct answer reliably carries (process family, reciprocating, the 25000 max;
    # numbers are matched comma-insensitively so "25,000" satisfies "25000").
    expected_answer_contains: ["process", "recip", "25000"]
    # The 3000 Nm3/hr duty sits well inside the Process family's published 25000 Nm3/hr / 1000 barg
    # envelope, so the answer must state 25000 and NOT frame it as near a limit, nor resurface the
    # website's rejected 20000 figure (milestone-5a §6 hydrogen fix, guarded at the answer layer).
    # Language-direction guard (LLD-RT-07): an English turn must answer in English. A live regression
    # saw an English turn recite the Hinglish exemplar, yet pass because it asserted English tech
    # terms. These romanised-Hindi function words cannot occur in an English reply or any product
    # name; the Devanagari direction is already guarded by `script_purity`, so every reply language
    # now has a golden asserting the other two do not appear uninvited.
    must_not_contain: ["20000", "near a published limit", "near-edge",
                       "aapki", "aapke", "aapko", "hamari", "chahiye", "kya main"]
    expected_source_ids: ["cap.doc_jyotech_catalog_process_s005.0", "fam.process_recip"]
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: hydrogen, capacity: 3000, capacity_unit: "Nm3/hr", discharge_p: 350, lubricated: false}
      expect_ids: ["fam.process_recip"]
    retrieval:
      # Mirrors the application agent's retrieval: family-filtered to the matched process family
      # (LLD-AG-01 fix), so the PROCESS catalogue chunk surfaces — not the hydrogen-fuelling page.
      query: "Process Compressors (Recip.) hydrogen"
      family_ids: ["fam.process_recip"]
      expect_doc: doc.jyotech_catalog_process

  - id: cap-hydrogen-small-kghr
    question: "Do you have a small hydrogen compressor around 30 kg/hr up to 800 bar?"
    expected_answer_contains: ["hydrogen"]
    expected_source_ids: ["fam.hydrogen_compressor"]
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: hydrogen, capacity: 30, capacity_unit: "kg/hr", discharge_p: 800, lubricated: false}
      expect_ids: ["fam.hydrogen_compressor"]

  - id: cap-hydrogen-fuelling
    # Product-shaped ("tell me about X") so it routes to product_advisor and is answered from
    # get_product (family name), not slot-filled by application_discovery.
    question: "Tell me about your hydrogen fuelling systems."
    expected_answer_contains: ["hydrogen", "fuelling"]
    expected_source_ids: ["fam.hydrogen_fuelling_system"]
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: hydrogen, capacity: 100, capacity_unit: "Nm3/hr", discharge_p: 350}
      expect_ids: ["fam.hydrogen_fuelling_system"]
    retrieval:
      query: "hydrogen fuelling station"
      expect_doc: doc.jyotech_catalog_process

  - id: cap-oxygen-recip
