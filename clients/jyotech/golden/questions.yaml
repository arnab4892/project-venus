    # coverage, never collapse to the engine MCH-16 by substring containment. The two DISTINCT
    # variant family ids prove each item fetched its own record; the pipe proves a Markdown table;
    # the must_not guards the false "same family" claim our data contradicts (mch_smart_bac vs
    # mch_ergo_bac). Proven by the live trace (get_product per item → distinct families).
