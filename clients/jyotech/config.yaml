# Jyotech client registry entry.
# handoff routing, theme and seeds are filled in by later milestones (and mirrored
# into ops.client / ops.prompt_version).
client_id: jyotech
domain: www.jyotech.com

# Gas alias map (LLD-TOOL-01). Applied at query time in match_capability so a user
# saying "hydrogen" matches the verbatim stored gas ("H2"); facts are never rewritten.
# Both long names and symbols map to one canonical symbol so the messy stored forms
# (H2 / hydrogen / Hydrogen, O2 / Oxygen / OXYGEN, …) all compare equal.
gas_aliases:
  hydrogen: H2
  h2: H2
  oxygen: O2
  o2: O2
  helium: He
  he: He
  nitrogen: N2
  n2: N2
  argon: Ar
  ar: Ar
  carbon dioxide: CO2
  co2: CO2
  carbon monoxide: CO
  co: CO
  # Bio-gas is stored in several forms ("Bio Gas", "BioGas", "Purified Biogas"); canonicalise
  # the query and the stored forms to one token so "biogas" matches "Bio Gas".
  bio gas: biogas
  biogas: biogas
  purified biogas: biogas
