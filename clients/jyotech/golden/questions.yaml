    # additional_areas → get_product resolves the capability-only family → its capability rows are
    # fetched and cited. The capability-row id is the luck-proof anchor: chunks can wander, but
    # cap.doc_hydrogen_compressors_and_fueling_system_s000.1 is cited ONLY if the fetch happened;
    # "J2601" is that row's published standard. Proven by the live single-turn trace.
    question: "What do you offer for a hydrogen refuelling station?"
    expected_answer_contains: ["J2601", "fuelling"]
    expected_source_ids: ["fam.hydrogen_fuelling_system",
                          "cap.doc_hydrogen_compressors_and_fueling_system_s000.1"]
