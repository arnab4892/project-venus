  - id: prod-mch16-specs
    # Regression (M5b live miss): for a named model, product_advisor must compose the PUBLISHED
    # specs from the family-scoped catalogue chunk (F.A.D. 265 lpm, petrol/diesel engine) — not
    # just confirm the model name and say "no details available". "MCH-16" also matches the
    # electric variants, so the answer must acknowledge them ("electric"), not present the engine
    # version as the whole story. The F&S catalogue is the source.
    question: "Tell me about the MCH-16."
    expected_answer_contains: ["265", "petrol", "electric"]
    # Voice: provenance rides in the citations, never in the prose (Part C). Not a document ask,
    # so no document/catalogue/page/"Source:" line may appear in the answer text.
    # Language-direction guard (LLD-RT-07): an English product turn must answer in English, not drift
    # into the vivid Hinglish MCH-16 exemplar — romanised-Hindi function words that can never appear
    # in an English reply or a product name.
    must_not_contain: ["Source:", "catalog", "catalogue", "page)",
                       "aapki", "aapke", "aapko", "hamari", "chahiye", "kya main"]
    expected_source_ids: ["doc.jyotech_catalog_f_s"]
    expected_outcome: answer
    fact:
      tool: get_product
      args: {model_or_family: "MCH-16"}
      expect_ids: ["fam.mch_engine_bac"]

  - id: prod-price-handoff
    # Prices are not published — no price may ever be invented. The fact layer confirms the
    # MCH-16 product exists, but the correct outcome is a handoff, not an answer.
    question: "How much does the MCH-16 cost?"
    expected_answer_contains: []
    # No price may ever be stated or invented — the commercial handoff carries no figure.
    must_not_contain: ["₹", "rs.", "rupee", "lakh", "usd", "$"]
    # A price ask routes to commercial_routing, which always hands off (no product lookup), so the
    # e2e turn cites nothing; the fact layer below still guards that the MCH-16 product exists.
    expected_source_ids: []
    expected_outcome: handoff
    fact:
      tool: get_product
      args: {model_or_family: "MCH-16"}
      expect_ids: ["fam.mch_engine_bac"]

  - id: e2e-hindi-price
    # e2e-only (PRD-F-012 Hindi / LLD-RT-07): a Devanagari price ask must hand off in Hindi with no
    # figure. The reply is a fixed per-language handoff template (commercial_routing / product_advisor
    # both carry a vetted "hi" template), so the anchor is a substring PRESENT IN BOTH templates —
    # "जोड़" (connect) — which proves a Devanagari reply regardless of which handoff path triage picks.
    # must_not mirrors prod-price-handoff: no currency/price token may ever appear.
    question: "MCH-16 की कीमत क्या है?"
    expected_answer_contains: ["जोड़"]
    must_not_contain: ["₹", "rs.", "rupee", "lakh", "usd", "$"]
    expected_source_ids: []
    expected_outcome: handoff
    # Strict register (LLD-RT-07): whichever fixed hi handoff template triage picks
    # (commercial_routing / product_advisor) must be pure written Hindi — no Latin outside the three
    # exceptions. Both templates are now register-pure; this asserts it end to end.
    script_purity: hi

  - id: prod-nameless-cabinet
