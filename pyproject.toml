[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentkit"
version = "0.1.0"
description = "Nyalazone reusable RAG-agent framework (Jyotech Agent, iteration 1)"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    # web / runtime
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "langgraph>=0.2,<0.3",
    # data layer
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "pgvector>=0.3,<0.4",
    "psycopg[binary]>=3.2,<4.0",
    # models / config
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    # ingestion / release
    "docling>=2.0,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "openpyxl>=3.1,<4.0",
    # extraction LLM (CR-0002; OpenAI-compatible, external-capable)
    "openai>=1.50,<2.0",
    # cli / misc
    "typer>=0.15,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "ruff>=0.7,<0.8",
]
# Dev-only chat harness (apps/dev_ui.py). Not part of the shipped wheel; pinned to
# the current stable gradio major (5.x). See apps/README.md.
ui = [
    "gradio>=5,<6",
]
# Dev-only turn tracing (runtime/tracing.py) against an EXISTING external self-hosted Langfuse
# (v4 server). SDK only — no Langfuse infra lives in this repo. Not part of the shipped wheel;
# pinned to the current langfuse major (4.x, OTel-based). Unset LANGFUSE_* → tracing fully off.
dev-obs = [
    "langfuse>=4.15,<5",
]

[project.scripts]
agentkit = "agentkit.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
