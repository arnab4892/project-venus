    question: "Compress chlorine, 100 Nm3/hr to 500 bar?"
    expected_answer_contains: ["engineers"]
    expected_source_ids: []
    expected_outcome: handoff
    fact:
      tool: match_capability
      args: {gas: chlorine, capacity: 100, capacity_unit: "Nm3/hr", discharge_p: 500}
      expect_ids: []

  - id: cap-process-max-capacity
    # Permanent guard on the 20000-vs-25000 adjudication (milestone-3b review): the published
    # maximum is 25000 Nm3/hr via cap.doc_jyotech_catalog_process_s005.0. If a future
    # re-extraction resurrects the website's rejected 20000 figure, this question must fail.
    # Framed as a near-top process duty so a single application_discovery turn reliably states the
    # family's published maximum (25000) — a duty-less "what's the max" has no clean single-turn
    # agent path. The permanent 25000-vs-20000 guard lives in the fact block below and in the
    # answer-layer must_not_contain: the rejected website figure must never resurface.
    question: "We're sizing a hydrogen process compressor around 5000 Nm3/hr at 500 bar, oil-free — what is the top capacity your process gas range is published to?"
    expected_answer_contains: ["25000"]
    must_not_contain: ["20000"]
    expected_source_ids: ["cap.doc_jyotech_catalog_process_s005.0", "fam.process_recip"]
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: hydrogen, capacity: 25000, capacity_unit: "Nm3/hr", discharge_p: 1000, lubricated: false}
      expect_ids: ["cap.doc_jyotech_catalog_process_s005.0"]

  - id: cap-natgas-unit-conversion
    # Exercises the documented 1 Nm3/hr = 24 SCMD conversion: 2000 Nm3/hr = 48000 SCMD, which
    # falls inside the family's published SCMD range [10000, 100000] (LLD-EXT-09).
    question: "Natural gas, about 2000 Nm3/hr at 100 bar?"
    # Runtime may lead with either the gas-specific or the Process family (both force-cited);
    # "natural" is present either way. The SCMD unit-conversion guard stays in the fact block.
    expected_answer_contains: ["natural"]
    expected_source_ids: ["fam.process_recip"]
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: "natural gas", capacity: 2000, capacity_unit: "Nm3/hr", discharge_p: 100}
      expect_ids: ["fam.natural_gas_recip"]

  - id: e2e-hinglish-hydrogen
    # e2e-only (PRD-F-012 Hinglish): NO fact/retrieval blocks — scored only at the e2e layer.
    # Full duty (gas + capacity + discharge) so a single Hinglish turn matches and ANSWERS in
    # Hinglish (the acceptance), not asks a slot. The customer-facing family name "process gas"
    # stays English even in a Hinglish reply; the near-edge/20000 guards mirror cap-hydrogen-process.
    question: "Hydrogen compressor chahiye, 3000 Nm3/hr, 350 bar tak, oil-free"
    # Family name stays English in a Hinglish reply ("Process Compressors (Recip.)").
    expected_answer_contains: ["process", "recip"]
    must_not_contain: ["20000", "near-edge"]
    expected_source_ids: ["fam.process_recip"]
    expected_outcome: answer

  - id: e2e-hindi-hydrogen
    # e2e-only (PRD-F-012 Hindi / LLD-RT-07): NO fact/retrieval blocks — scored only at the e2e
    # layer. Mirrors e2e-hinglish-hydrogen; the reply is LLM-composed, so it asserts robust family
    # substrings, NOT a figure (the English cap-hydrogen-process owns the 25000 guard; Devanagari
    # digit-folding has its own unit tests). The Devanagari anchor "है" (the highest-frequency Hindi
    # copula, near-certain in any conversational Hindi reply) fails an English/Hinglish reply — the
    # single-turn way to assert the reply actually came out in Devanagari. Family/model names and
    # units stay English (Latin script) even in a Hindi reply.
    question: "हाइड्रोजन compressor चाहिए, 3000 Nm3/hr, 350 bar तक, oil-free"
    expected_answer_contains: ["process", "recip", "है"]
    must_not_contain: ["20000", "near-edge"]
    expected_source_ids: ["fam.process_recip"]
    expected_outcome: answer
    # Strict register (LLD-RT-07): after **bold** product/family names, units and standard codes
    # are stripped, no ordinary Latin-script word may remain — the reply must be pure written Hindi.
    script_purity: hi

