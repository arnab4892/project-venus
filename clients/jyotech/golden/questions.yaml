    # part — handled EXACTLY as the green co-founded golden does, i.e. the loose `199` prefix that
    # does NOT strictly assert 1990-vs-1991 (a known unresolved web/catalogue data conflict). Both
    # substrings present proves BOTH parts were answered; `must_not "|"` proves ordered prose, not
