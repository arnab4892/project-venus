    # get_product doesn't resolve this family by name, so depending on the parse the runtime cites
    # either the family (list path) or the air-separation document (search path) — both correct.
    # The fact layer below guards fam.air_separation_plant; e2e asserts the grounded answer content.
    expected_source_ids: []
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: nitrogen, capacity: 1000, capacity_unit: "TPD", discharge_p: 0}
      expect_ids: ["fam.air_separation_plant"]

  - id: cap-biogas
    question: "Bio gas compressor around 800 Nm3/hr at 250 bar?"
    # Bio-gas spans several published families; the runtime may recommend/force-cite any of them,
    # so e2e asserts the grounded answer content and the fact layer below guards the specific family.
    expected_answer_contains: ["bio gas"]
    expected_source_ids: []
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: "Bio Gas", capacity: 800, capacity_unit: "Nm3/hr", discharge_p: 250}
      expect_ids: ["fam.biogas_hp_compressor"]

  - id: cap-hydrogen-near-edge
    question: "Hydrogen at 24000 Nm3/hr, 900 bar — is that within your published range?"
    expected_answer_contains: ["engineers"]
    expected_source_ids: ["fam.process_recip"]
    expected_outcome: answer
    fact:
      tool: match_capability
      args: {gas: hydrogen, capacity: 24000, capacity_unit: "Nm3/hr", discharge_p: 900, lubricated: false}
      expect_ids: ["fam.process_recip"]

